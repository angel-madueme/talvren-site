<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var t = s === "light" || s === "dark" ? s : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <title>IPME — Websites &amp; Automation for Small Businesses in Ireland</title>
    <meta
      name="description"
      content="IPME designs new websites, redesigns outdated ones, and automates repetitive work for small businesses across Ireland."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
